
name: Build StudyOS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StudyOS-Android-Project-v1.2-phase1.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q StudyOS-Android-Project-v1.2-phase1.zip
          test -f StudyOS-Android/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd StudyOS-Android
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: StudyOS-APK-v1.2-phase1
          path: StudyOS-Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          
