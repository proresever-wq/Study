
name: Build DERASTAK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: derastak-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "27.2.12479018"
      CMAKE_VERSION: "3.22.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Extract source archive
        run: |
          ARCHIVE="DERASTAK-Local-Only-Fix-v2.2.1-source.zip"

          test -s "$ARCHIVE"
          mkdir -p .build-src
          unzip -q "$ARCHIVE" -d .build-src

          PROJECT="$GITHUB_WORKSPACE/.build-src/StudyOS-Android"

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/cpp/CMakeLists.txt"

      - name: Verify source files
        working-directory: .build-src/StudyOS-Android
        run: |
          if [ -f scripts/verify-source.sh ]; then
            bash scripts/verify-source.sh
          else
            echo "Source verification script not found"
            exit 1
          fi

      - name: Build APK
        working-directory: .build-src/StudyOS-Android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK=".build-src/StudyOS-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DERASTAK-debug-apk
          path: .build-src/StudyOS-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
