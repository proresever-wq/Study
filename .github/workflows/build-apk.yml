
name: Build StudyOS v1.5.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StudyOS-Android-Project-v1.5.1-ImageViewer.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q StudyOS-Android-Project-v1.5.1-ImageViewer.zip
          test -f StudyOS-Android/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd StudyOS-Android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyOS-APK-v1.5.1
          path: StudyOS-Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
