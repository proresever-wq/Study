
name: Build StudyOS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StudyOS-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q StudyOS-Android-Project.zip
          test -f StudyOS-Android/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Android Java target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("StudyOS-Android/app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions {" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )

          p.write_text(s)
          print(p.read_text())
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd StudyOS-Android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyOS-APK
          path: StudyOS-Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
