
name: Build StudyOS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StudyOS-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q StudyOS-Android-Project.zip
          test -d StudyOS-Android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Java and Kotlin versions
        run: |
          find StudyOS-Android/app -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i \
            -e 's/VERSION_1_8/VERSION_17/g' \
            -e 's/JVM_1_8/JVM_17/g' \
            -e 's/"1.8"/"17"/g' \
            -e "s/'1.8'/'17'/g" {} +

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd StudyOS-Android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyOS-APK
          path: StudyOS-Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          
